name: Bug report
description: A defect in the library or the ots CLI.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing! Security-sensitive bugs should be reported via
        [private vulnerability reporting](https://github.com/${{ github.repository }}/security/advisories/new)
        instead, per SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Version
      description: Library or CLI version (run `ots --version` for CLI; check the .nupkg name for library).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        Describe the unexpected behaviour. If the bug involves a specific
        .ots fixture, please attach or paste it (hex-encoded is fine).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal C# snippet or CLI invocation. The smaller the better.
      render: shell
    validations:
      required: true

  - type: input
    id: dotnet
    attributes:
      label: .NET runtime
      description: Output of `dotnet --info` (one-line summary is fine).
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / platform
      placeholder: "Ubuntu 22.04 / Windows 11 / macOS 14"
    validations:
      required: true
