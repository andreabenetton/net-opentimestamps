version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      xunit:
        patterns:
          - "xunit*"
          - "Xunit*"
      test-tooling:
        patterns:
          - "coverlet.*"
          - "BenchmarkDotNet*"
    ignore:
      # Microsoft.Extensions.* packages are runtime-major-locked: keep on
      # the 9.0.x track while the library targets net9.0. Bump the major
      # alongside the TFM, not before.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "nuget"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
