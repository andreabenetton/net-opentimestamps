name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: "Push to nuget.org (requires NUGET_API_KEY secret)?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write     # gh release create
  packages: write     # if we ever push to GH Packages
  id-token: write     # OIDC for sigstore-style attestations

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-pack:
    name: build + pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OTS_SKIP_NETWORK: 1

    outputs:
      version: ${{ steps.derive.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # SourceLink + tag-derived version need full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Derive version from tag (or fall back to VersionPrefix)
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            # workflow_dispatch on a branch: use VersionPrefix from props
            ver=$(grep -oE '<VersionPrefix>[^<]+</VersionPrefix>' Directory.Build.props | \
                   sed -E 's/<\/?VersionPrefix>//g')
            ver="${ver}-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building version: $ver"

      - name: Restore + build (Release)
        run: |
          dotnet restore OpenTimestamps.sln
          dotnet build OpenTimestamps.sln --configuration Release --no-restore \
            -p:Version=${{ steps.derive.outputs.version }}

      - name: Test
        run: >
          dotnet test OpenTimestamps.sln
          --configuration Release
          --no-build
          --logger "console;verbosity=minimal"

      - name: Pack library + CLI
        run: |
          dotnet pack src/OpenTimestamps/OpenTimestamps.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.derive.outputs.version }} \
            -o artifacts
          dotnet pack src/OpenTimestamps.Cli/OpenTimestamps.Cli.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.derive.outputs.version }} \
            -o artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload nupkg + snupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/*.*nupkg
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: build-pack
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install CycloneDX dotnet tool
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        run: |
          dotnet CycloneDX OpenTimestamps.sln \
            --json --output ./sbom --filename net-opentimestamps.sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/net-opentimestamps.sbom.json
          if-no-files-found: error
          retention-days: 90

  publish-nuget:
    name: publish to nuget.org
    runs-on: ubuntu-latest
    needs: [build-pack, sbom]
    timeout-minutes: 15
    # Auto-fire on tag push; on workflow_dispatch require the explicit choice.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.publish_nuget == 'true')

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download nupkgs
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: artifacts/

      - name: Sanity-check NUGET_API_KEY
        shell: bash
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "::error::NUGET_API_KEY secret is not configured."
            echo "Configure it in repo settings -> Secrets and variables -> Actions"
            echo "to enable NuGet publishing."
            exit 1
          fi

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

  github-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: [build-pack, sbom]
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - name: Download nupkgs
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: artifacts/

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: artifacts/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-pack.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            artifacts/*.nupkg artifacts/*.snupkg artifacts/net-opentimestamps.sbom.json
